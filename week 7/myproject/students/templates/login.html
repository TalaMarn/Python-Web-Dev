<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
  </head>
  <body>
    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">{{ form.username.label }} {{ form.username }}</div>
      <div class="mb-3">{{ form.password.label }} {{ form.password }}</div>
      <button type="submit" class="btn btn-primary">Login</button>
      <a href="{% url 'register' %}">Create Account</a>
    </form>
  </body>
</html>
