<!DOCTYPE html>
<html>
    <head>
        <title>My Portfolio</title>
        <style>
            body {
                font-family: Arial, Helvetica, sans-serif;
                margin: 0;
                background-color: #f4f4f4;
            }
            header {
                background: #333;
                color : white;
                padding: 15px;
                text-align: center;
            }
            nav {
                background: #555;
                padding: 10px;
                text-align: center;
            }
            nav a {
                color: white;
                margin: 10px;
                text-decoration: none;
                font-weight: bold;
            }
            nav a:hover {
                color: yellow;
            }
            .container {
                padding: 20px;
            }
            .card {
                background: white;
                padding: 15px;
                margin: 15px 0;
                border-radius: 10px;
                box-shadow: 0 0 10px rgb(0, 0, 0, 0.1);
            }
            img {
                width: 150px;
                border-radius: 50%;
            }
            footer {
                text-align: center;
                padding: 10px;
                background: #333;
                color: white;
                margin-top: 20px;
            }
            button {
                background: #333;
                color: white;
                border: none;
                padding: 10px;
                cursor: pointer;
            }
            button:hover {
                background: #555;
            }

        </style>
    </head>
    <body>
        <!--Header-->
        <header>
            <h1>My Portfolio</h1>
            <p>Welcome to my personal website!</p>
        </header>
        <!--Navigation-->
        <nav>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
        <div class="container">
            <!--About Section-->
            <div class="card" id="about">
                <h2>About Me</h2>
                <img src="img/easter-bunny.png" alt="My Photo"/>
                <p>Hello! My name is Aung Aung. I'm learning web development</p>
            </div>
            <!--Skills-->
            <div class="card" id="skills">
                <h2>My Skills</h2>
                <ul>
                    <li>HTML</li>
                    <li>Python</li>
                    <li>Database</li>
                </ul>
            </div>
            <!--Projects-->
            <div class="card" id="projects">
                <h2>Projects</h2>
                <ol>
                    <li>Movie Ticket System</li>
                    <li>Student Management System</li>
                </ol>
            </div>
            <!--Contact-->
            <div class="card" id="contact">
                <h2>Contact Me</h2>
                <form>
                    <label>Name:</label><br>
                    <input type="text"><br><br>
                    <label>Email:</label><br><br>
                    <input type="email" placeholder="Your Email"/><br><br>
                    <button type="submit">Send</button>
                </form>
            </div>
        </div>
        <!--Footer-->
        <hr>
        <p>@ 2026 My Portfolio</p>
    </body>
</html>
